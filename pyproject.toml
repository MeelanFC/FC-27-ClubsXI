[project]
name = "clubsxi"
version = "0.1.0"
description = "Match collector, stats tracker and lineup picker for EA SPORTS FC 27 Pro Clubs (Clubs)"
readme = "README.md"
keywords = ["pro clubs", "ea fc", "fc 27", "fc 26", "clubs", "ea sports fc", "proclubs api", "stats tracker", "lineup", "football", "soccer"]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
